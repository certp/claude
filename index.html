<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Cert Practice</title>
<style>
:root{
  --bg:#f4f5fb; --surface:#ffffff; --surface-2:#f1f2f9; --ink:#14172b; --muted:#6a6f8a; --line:#e3e5f1;
  --primary:#4f46e5; --primary-ink:#fff; --primary-soft:#eceafd;
  --ok:#12a150; --ok-soft:#e3f6ec; --bad:#e5484d; --bad-soft:#fdeaea; --warn:#d98200; --warn-soft:#fff3dc;
  --gray:#dfe1ec; --gray-ink:#6a6f8a;
  --shadow:0 1px 2px rgba(20,23,43,.05),0 8px 24px rgba(20,23,43,.06);
  --radius:16px;
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0f1c; --surface:#161a2e; --surface-2:#1d2240; --ink:#e9ebfa; --muted:#9298b8; --line:#2a3052;
  --primary:#7c83ff; --primary-ink:#0d0f1c; --primary-soft:#242a58;
  --ok:#3ddc84; --ok-soft:#10301f; --bad:#ff6b70; --bad-soft:#3a1519; --warn:#ffb640; --warn-soft:#3a2a0c;
  --gray:#2a3052; --gray-ink:#9298b8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.25}
code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:.1em .4em;border-radius:6px}
.rich p{margin:0 0 .75em}.rich p:last-child{margin-bottom:0}
.rich ul,.rich ol{margin:.4em 0 .8em;padding-left:1.4em}
.rich pre{overflow:auto;background:var(--surface-2);padding:12px;border-radius:10px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  padding:9px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn:disabled:hover{border-color:var(--line);color:inherit}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--primary-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent}
.btn.lg{padding:13px 26px;font-size:15px;border-radius:14px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Home ---------- */
.home{max-width:1100px;margin:0 auto;padding:clamp(32px,7vw,88px) 20px 56px}
.home .eyebrow{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);
  background:var(--primary-soft);padding:6px 12px;border-radius:99px}
.home h1{font-size:clamp(30px,5vw,50px);letter-spacing:-.02em;margin:18px 0 12px}
.home h1 span{background:linear-gradient(90deg,#7c3aed,#4f46e5 45%,#0ea5a4);-webkit-background-clip:text;background-clip:text;color:transparent}
.home p.lead{color:var(--muted);font-size:17px;max-width:620px;margin:0 0 40px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.cert-card{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:26px;box-shadow:var(--shadow);
  overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s;display:flex;flex-direction:column;gap:14px}
.cert-card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--accent)}
.cert-card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--accent);opacity:.08}
.cert-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 14px 36px rgba(20,23,43,.14)}
.badge{width:auto;min-width:52px;height:52px;padding:0 10px;white-space:nowrap;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:.02em;background:var(--accent)}
.cert-card h2{font-size:20px}
.cert-card .sub{color:var(--muted);font-size:14px;margin-top:-6px}
.cert-card .desc{color:var(--muted);font-size:14px;flex:1}
.cert-card .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.cert-card .meta b{color:var(--ink)}
.cert-card .go{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--accent)}
.bar{height:6px;background:var(--gray);border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}

/* ---------- Shell ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.back:hover{border-color:var(--primary);color:var(--primary)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .badge{min-width:38px;height:38px;padding:0 8px;font-size:11px;border-radius:11px}
.brand b{display:block;font-size:15px;line-height:1.2}.brand small{color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--surface-2);padding:4px;border-radius:13px;gap:2px;margin-left:8px}
.seg button{border:0;background:transparent;padding:7px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(20,23,43,.12)}
.spacer{flex:1}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--surface-2);padding:8px 14px;border-radius:11px;display:inline-flex;gap:6px;align-items:center}

.layout{max-width:1400px;margin:0 auto;padding:20px;display:grid;grid-template-columns:292px minmax(0,1fr);gap:20px;align-items:start}
.layout.single{grid-template-columns:minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.side{position:sticky;top:76px;padding:18px;max-height:calc(100vh - 96px);display:flex;flex-direction:column;gap:14px}
.side h3,.side .legend{flex:none}
.side h3{font-size:14px;display:flex;justify-content:space-between;align-items:center}
.side h3 span{color:var(--muted);font-weight:600;font-size:13px}
#map-slot{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0 -8px;padding:4px 8px;scrollbar-width:thin}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.node{aspect-ratio:1;border-radius:50%;border:2px solid transparent;background:var(--gray);color:var(--gray-ink);font-weight:700;font-size:12.5px;display:grid;place-items:center;
  padding:0;transition:transform .12s,background .15s}
.node:hover{transform:scale(1.1)}
.node{position:relative}
.mb{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 3px;border-radius:99px;background:var(--warn);color:#fff;font-size:10px;line-height:16px;font-weight:800;text-align:center;box-shadow:0 0 0 2px var(--surface)}
.node.done{background:var(--ok);color:#fff}
.node.bad{background:var(--bad);color:#fff}
.node.cur{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%}
.progress{height:8px;border-radius:9px;background:var(--gray);overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* ---------- Question card ---------- */
.qcard{padding:clamp(18px,3vw,32px)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted);font-size:13px;font-weight:600}
.qnum{background:var(--accent);color:#fff;border-radius:10px;padding:3px 12px;font-weight:800;font-size:13px}
.tag{background:var(--warn-soft);color:var(--warn);padding:3px 10px;border-radius:99px}
.qtext{font-size:17px;font-weight:500;line-height:1.65;margin-bottom:22px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;transition:.14s}
.opt:hover:not([disabled]){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.opt[disabled]{cursor:default}
.mark{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted);transition:.14s}
.multi .mark{border-radius:9px}
.opt .t{flex:1;padding-top:3px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .mark{background:var(--bad);border-color:var(--bad);color:#fff}
.peek{margin-left:auto;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700}
.peek:hover,.peek.on{background:var(--accent);color:#fff}
.en{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);font-size:.92em;font-weight:400}
.hint{margin-top:14px;font-size:13px;color:var(--muted)}
.feedback{margin-top:20px;border-radius:14px;padding:16px 18px;border:1px solid}
.feedback.ok{background:var(--ok-soft);border-color:var(--ok)}
.feedback.ko{background:var(--bad-soft);border-color:var(--bad)}
.feedback.info{background:var(--primary-soft);border-color:var(--primary)}
.feedback.info h4{color:var(--primary)}
.feedback h4{margin:0 0 6px;font-size:15px}
.feedback.ok h4{color:var(--ok)}.feedback.ko h4{color:var(--bad)}
.feedback .ans{font-size:14px;margin-bottom:8px}
.feedback .why{font-size:14px;color:var(--ink);opacity:.92}
.answer-tip{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;background:var(--surface);color:var(--ink);font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.answer-tip.caution{border-left-color:var(--bad)}
.answer-tip .tip-contrast{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.answer-tip h5{font-size:14px;margin:0 0 6px}.answer-tip p{margin:0}.answer-tip .tip-keywords{margin-top:8px;font-size:13px;color:var(--muted)}.answer-tip code{white-space:normal;overflow-wrap:anywhere;color:var(--ink)}
.qfoot{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.kbd{font-size:11px;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.7}

/* ---------- Exam intro / result ---------- */
.hero{padding:clamp(24px,5vw,56px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.hero .badge{min-width:68px;height:68px;font-size:19px;border-radius:20px}
.hero h2{font-size:clamp(22px,3.5vw,30px)}
.hero p{color:var(--muted);max-width:560px;margin:0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%;max-width:640px;margin:8px 0}
.rule{background:var(--surface-2);border-radius:14px;padding:14px}
.rule b{display:block;font-size:24px;color:var(--accent)}.rule span{font-size:13px;color:var(--muted)}
.result{padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,48px);align-items:center}
.ring{position:relative;width:176px;height:176px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:38px;line-height:1}.ring .c span{font-size:13px;color:var(--muted)}
.verdict{display:inline-block;font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.01em;padding:4px 18px;border-radius:14px;margin-bottom:6px}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}.verdict.fail{background:var(--bad-soft);color:var(--bad)}
.result .sub{color:var(--muted);margin:0 0 16px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 16px;min-width:96px}.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--muted)}
.score-note{line-height:1.65;color:var(--muted);font-size:13px}
.domain-scoreboard{padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;gap:18px}
.domain-scoreboard h3{font-size:19px}
.domain-scoreboard .sub{color:var(--muted);font-size:13px}
.domain-scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr));gap:12px}
.domain-score{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.domain-score .domain-heading{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.domain-score .domain-heading b{font-size:14px}
.domain-score .domain-heading .domain-count{white-space:nowrap;font-weight:700;font-size:13px}
.domain-score small{color:var(--muted);font-size:12px}
.domain-score .domain-track{height:7px;border-radius:20px;background:var(--gray);overflow:hidden}
.domain-score .domain-fill{height:100%;background:var(--accent);border-radius:20px}
.domain-score .domain-empty{color:var(--muted);font-size:13px}
.domain-priorities{border-top:1px solid var(--line);padding-top:16px}
.domain-priorities p{margin:8px 0 0;color:var(--muted)}
.domain-priorities ol{margin:8px 0 0;padding-left:22px}
.domain-priorities li{margin:6px 0}
.review{display:flex;flex-direction:column;gap:16px}
.review h3{font-size:18px}
.rv .qcard{padding:clamp(16px,2.5vw,26px)}
.rv[data-status="correct"] .qhead .qnum{background:var(--ok)}
.rv[data-status="incorrect"] .qhead .qnum{background:var(--bad)}
.rv[data-status="unanswered"] .qhead .qnum{background:var(--gray);color:var(--gray-ink)}
.rv .qhead .tag.un{background:var(--surface-2);color:var(--muted)}
.review{scroll-margin-top:90px}
.review-filters{display:flex;flex-wrap:wrap;gap:8px}
.review-filter{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:700;color:var(--muted)}
.review-filter[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent)}
.review-result{font-weight:700}
.review-result.correct{background:var(--ok-soft);color:var(--ok)}
.review-result.incorrect{background:var(--bad-soft);color:var(--bad)}
.review-result.unanswered{background:var(--surface-2);color:var(--muted)}
.choice-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.choice-flag{display:inline-flex;border-radius:6px;padding:2px 7px;font-size:11px;line-height:1.5;font-weight:700}
.choice-flag.chosen{background:var(--primary-soft);color:var(--primary)}
.choice-flag.correct{background:var(--ok-soft);color:var(--ok)}
.review-answer{line-height:1.8}
.review-answer .answer-right{color:var(--ok)}
.review-explain{background:var(--surface-2);border-color:var(--line)}
.review-pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.review-pager span{font-size:13px;color:var(--muted);font-weight:700;text-align:center}
.review-empty{padding:18px;color:var(--muted)}
@media(max-width:760px){.review-filter{min-height:44px}.review-pager .btn{flex:1}}
.lbl{font-size:12px;font-weight:700;margin:2px 0 0 44px;color:var(--muted)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,12,28,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .15s}
.modal{background:var(--surface);border-radius:20px;padding:26px;max-width:420px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .18s}
.modal h3{font-size:19px;margin-bottom:8px}.modal p{color:var(--muted);margin:0 0 22px}
.modal .row{display:flex;gap:10px;justify-content:flex-end}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:14px}
  .side{position:static;max-height:none}
  .map{grid-template-columns:repeat(auto-fill,minmax(36px,1fr))}
  #map-slot{flex:none;max-height:160px}
  .result{grid-template-columns:1fr;text-align:center;justify-items:center}
  .kpis{justify-content:center}
  .seg{margin-left:0}
}
@media (max-width:560px){
  .topbar-in{padding:8px 12px}.brand small{display:none}
  .qtext{font-size:16px}.btn{padding:9px 13px}
}
.topic-label{max-width:100%}.topic-label select{min-width:0;max-width:min(56vw,24em)}
.mobile-toggle,.map-toggle{display:none}
@media(max-width:760px){
  .home{padding:24px 14px}.home p.lead{margin-bottom:22px}.cards{grid-template-columns:minmax(0,1fr);gap:12px}.cert-card{padding:18px;gap:8px}.cert-card .badge{align-self:start;height:38px}
  .topbar{position:static;background:var(--surface)}.topbar-in{gap:6px;padding:8px 10px}.topbar-in>.spacer,.brand>div:last-child{display:none}
  .back,.peek{min-height:44px;min-width:44px}.topbar-in>.seg{margin-left:auto}.seg button{min-height:44px;padding:5px 11px}
  .mobile-toggle{display:inline-flex}.mobile-toggle[aria-expanded=false]+.actions{display:none}
  .mobile-toggle+.actions{width:100%;padding:10px 0 2px;border-top:1px solid var(--line)}.actions:empty{display:none}
  .btn{min-height:44px}.btn select{font:inherit;font-size:16px;min-height:40px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px}
  .topic-label{width:100%;justify-content:space-between;white-space:normal}.topic-label select{flex:1;max-width:100%;width:0}
  .layout{padding:10px;gap:10px;grid-template-columns:minmax(0,1fr)}.side{padding:5px 12px;gap:8px}.side h3{gap:8px;justify-content:flex-start}.side h3>span{margin-left:auto}
  .map-toggle{display:inline-block;background:var(--surface-2);color:var(--ink);border:0;border-radius:9px;min-width:48px;min-height:44px;font-weight:600}
  .side:not(.map-open) :is(#map-slot,.legend){display:none}.side.map-open{padding-bottom:12px}.map{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}.map .node{min-height:44px}
  .main{gap:10px}.stats{gap:5px}.stats .chip{padding:3px 8px}.stats .spacer,.kbd{display:none}.stats .btn:disabled{display:none}
  .qcard{padding:15px}.qtext{line-height:1.55;margin-bottom:16px}.qhead{gap:6px;margin-bottom:12px}.rich{min-width:0;overflow-wrap:anywhere}.rich pre,.rich table{max-width:100%;overflow:auto}.rich table{display:block}
  .opt{gap:8px;padding:12px 10px}.opt .mark{width:26px;height:26px}.opt .t{min-width:0;padding:0}.qfoot{gap:6px;margin-top:18px;padding-top:13px}.qfoot .btn{flex:1;padding:9px 6px;white-space:normal}
  .hero,.result{padding:18px}.result>div{min-width:0;max-width:100%}.hero .rules{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.rule{padding:8px 3px}.rule span{font-size:12px}.result .actions{justify-content:center}
}
@media (min-width:761px) and (max-width:1199px),

<script>
const DATA = Object.create(null);
const BY_ID = Object.create(null);
const QUESTION_COUNTS = Object.freeze({"ccaf":309,"ccao":193,"ccdf":155});
const BANK_LOADING = new Map();

// Load only the selected certification. Keep the original question IDs and order.
async function loadQuestionBank(cert) {
  if (DATA[cert]) return;
  if (!Object.hasOwn(QUESTION_COUNTS, cert)) throw new Error('Bộ câu hỏi không hợp lệ.');
  if (BANK_LOADING.has(cert)) return BANK_LOADING.get(cert);

  const pending = (async () => {
    const response = await fetch(`./data/${cert}.json`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const bank = await response.json();
    if (!bank || !Array.isArray(bank.qs) || bank.qs.length !== QUESTION_COUNTS[cert])
      throw new Error('Dữ liệu câu hỏi không đầy đủ.');

    const byId = Object.create(null);
    for (const q of bank.qs) {
      if (!q || typeof q.id !== 'string' || byId[q.id] ||
          typeof q.q !== 'string' || !Array.isArray(q.o) || !Array.isArray(q.a) ||
          !Array.isArray(q.v?.o) || q.v.o.length !== q.o.length ||
          !q.a.every(k => q.o.some(o => o.k === k)))
        throw new Error('Bộ câu hỏi chứa dữ liệu không hợp lệ.');
      byId[q.id] = q;
    }
    DATA[cert] = bank;
    BY_ID[cert] = byId;
  })();
  BANK_LOADING.set(cert, pending);
  try { await pending; } finally { BANK_LOADING.delete(cert); }
}

function showBankLoading() {

const ICON = {

const CERTS = [
  {id:'ccaf', code:'CCAR-F',  name:'Claude Certified Architect',  sub:'Foundations', accent:'#7c3aed', desc:'Kiến trúc, thiết kế hệ thống và các pattern xây dựng giải pháp với Claude.'},
  {id:'ccao', code:'CCAO-F', name:'Claude Certified Associate',  sub:'Foundations', accent:'#0d9488', desc:'Kiến thức nền tảng về Claude, cách dùng hiệu quả và các khái niệm cốt lõi.'},
  {id:'ccdf', code:'CCDV-F',  name:'Claude Certified Developer',  sub:'Foundations', accent:'#ea580c', desc:'Phát triển ứng dụng, agent và workflow tích hợp Claude.'}
];
const sizes = ['10','20','30','ALL'];
function countFor(choice, total){

}
function selectSize(choice){

}
// Exam Guide v1.1 (November 2026); only the blueprint effective BEFORE 2026-12-07.
const BLUEPRINTS = {
  ccaf: {
    items: 60,
    source: 'https://cc.sj-cdn.net/instructor/6nizmqk8tpzpfjvt6qmmav7rh/public/1794946250/Claude_Certified_Architect_-_Foundations_Exam_Guide.pdf',

    domains: [
      {id:'d1', en:'Agents and Workflows', vi:'Agent và quy trình', weight:14.7},
      {id:'d2', en:'Applications and Integration', vi:'Phát triển ứng dụng và tích hợp', weight:33.1},
      {id:'d3', en:'Claude Code', vi:'Vận hành Claude Code', weight:3.1},
      {id:'d4', en:'Eval, Testing, and Debugging', vi:'Đánh giá, kiểm thử và gỡ lỗi', weight:2.6},
      {id:'d5', en:'Model Selection and Optimization', vi:'Lựa chọn mô hình và tối ưu hóa', weight:16.8},
      {id:'d6', en:'Prompt and Context Engineering', vi:'Thiết kế prompt và ngữ cảnh', weight:11},
      {id:'d7', en:'Security and Safety', vi:'Bảo mật và an toàn', weight:8.1},

    ]

};
const domainLabel = (cert, id) => BLUEPRINTS[cert].domains.find(d => d.id===id);
// A saved review filter is valid only while its bank still has review questions.
// Otherwise upgrade it to all domains instead of rendering an empty question list.
const validTopic = (cert, topic) =>
  (domainLabel(cert,topic) || (topic==='review' && DATA[cert]?.qs.some(q=>q.topic==='review'))) ? topic : '';
function topicIds(cert, topic){
  return DATA[cert].qs.filter(q => !topic || q.topic === topic).map(q => q.id);
}
function examTopicIds(cert, topic){
  return DATA[cert].qs.filter(q => q.topic !== 'review' && (!topic || q.topic===topic)).map(q=>q.id);
}
function selectTopic(cert, topic, exam=false){
  const counts = new Map();
  for (const q of DATA[cert].qs) counts.set(q.topic,(counts.get(q.topic)||0)+1);
  const domains = BLUEPRINTS[cert].domains.map(d =>
    `<option value="${d.id}"${d.id===topic?' selected':''}>D${d.id.slice(1)} · ${d.vi} (${counts.get(d.id)||0})</option>`);
  if(!exam && counts.has('review')) domains.push(
    `<option value="review"${topic==='review'?' selected':''}>Cần kiểm tra phạm vi (${counts.get('review')})</option>`);
  const total = exam ? examTopicIds(cert).length : DATA[cert].qs.length;
  return `<label class="btn topic-label">Domain <select id="topic-filter"><option value="">Tất cả (${total})</option>${domains.join('')}</select></label>`;
}
function selectExamSize(choice, cert){
  const options = [
    ['OFFICIAL',`Đề mô phỏng (${BLUEPRINTS[cert].items})`],
    ['10','10 câu'],['20','20 câu'],['30','30 câu'],['ALL','Toàn bộ ngân hàng']
  ];
  return `<label class="btn">Số câu <select id="question-count">${options.map(([value,label]) =>
    `<option value="${value}"${value===choice?' selected':''}>${label}</option>`).join('')}</select></label>`;
}
function examCount(choice, total, cert){
  return choice==='OFFICIAL' ? Math.min(BLUEPRINTS[cert].items,total) : countFor(choice,total);
}

/* BEGIN WEIGHTED EXAM */
// Allocate the official proportions with Hamilton/largest remainder rounding.
// A domain exhausted by the bank is capped; remaining slots are redistributed.
function weightedExamQuotas(cert, number, pools){
  const domains = BLUEPRINTS[cert].domains.filter(d => (pools[d.id]||[]).length);
  const available = domains.reduce((sum,d)=>sum+pools[d.id].length,0);
  const n = Math.min(number,available);
  const weightTotal = domains.reduce((sum,d)=>sum+d.weight,0);
  const quotas = Object.fromEntries(BLUEPRINTS[cert].domains.map(d=>[d.id,0]));
  const ideal = Object.fromEntries(domains.map(d=>[d.id,n*d.weight/weightTotal]));
  for(const d of domains)quotas[d.id]=Math.min(pools[d.id].length,Math.floor(ideal[d.id]));
  let remain = n-Object.values(quotas).reduce((sum,v)=>sum+v,0);
  while(remain>0){
    const candidates=domains.filter(d=>quotas[d.id]<pools[d.id].length)
      .sort((a,b)=>(ideal[b.id]-quotas[b.id])-(ideal[a.id]-quotas[a.id]) || a.id.localeCompare(b.id));
    if(!candidates.length)throw Error('Not enough questions to fill the weighted exam');
    quotas[candidates[0].id]++;
    remain--;
  }
  return quotas;
}
function weightedExamIds(cert, number){
  const pools = Object.fromEntries(BLUEPRINTS[cert].domains.map(d=>[d.id,DATA[cert].qs
    .filter(q=>q.topic===d.id).map(q=>q.id)]));
  const quotas=weightedExamQuotas(cert,number,pools);
  return shuffle(BLUEPRINTS[cert].domains.flatMap(d=>shuffle(pools[d.id]).slice(0,quotas[d.id])));
}
/* END WEIGHTED EXAM */

function learnOrder(rnd){
  const ids = topicIds(route.cert, LRN.topic);
  return (rnd ? shuffle(ids) : ids).slice(0, countFor(LRN.size, ids.length));
}
const passMark = n => Math.ceil(n * 4 / 5);
/* BEGIN SCORING */
// App-specific training metrics. Never map raw accuracy to Anthropic's scaled score.
function scoreExam(cert, ids, answers){
  const domains = BLUEPRINTS[cert].domains.map(d => ({...d, total:0, correct:0, unanswered:0}));
  const byDomain = new Map(domains.map(d => [d.id, d]));
  let correct = 0, unanswered = 0, unclassified = 0;
  for(const id of ids){
    const question = BY_ID[cert][id];
    if(!question) throw new Error('Question missing from scoring bank: ' + id);
    const selected = Array.isArray(answers?.[id]) ? answers[id] : [];
    // Multiple-answer questions require the exact answer set (no partial credit).
    const right = same(selected, question.a);
    if(right) correct++;
    if(selected.length===0) unanswered++;
    const domain = byDomain.get(question.topic);
    if(!domain){ unclassified++; continue; }
    domain.total++;
    if(right) domain.correct++;
    if(selected.length===0) domain.unanswered++;
  }
  const total = ids.length;
  return {
    total, correct, incorrect:total-correct, unanswered, unclassified,
    accuracy: total ? correct * 100 / total : 0,
    targetReached: total > 0 && correct >= passMark(total),
    domains: domains.map(d => ({
      ...d, incorrect:d.total-d.correct, accuracy:d.total ? d.correct * 100 / d.total : null
    }))
  };
}
function weakestDomains(report, limit=3){
  return report.domains
    .filter(d => d.total > 0 && d.accuracy < 80)
    .sort((a,b) => a.accuracy-b.accuracy || b.total-a.total || a.id.localeCompare(b.id))
    .slice(0,limit);
}
const displayScorePercent = percentage => Number.isInteger(percentage) ? String(percentage) : percentage.toFixed(1);
/* END SCORING */
const certById = id => CERTS.find(c => c.id === id);
const ALL_IDS = id => DATA[id].qs.map(q => q.id);

/* ---------- storage ---------- */
const LS = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const KEY = (c, m) => `ccprac.v1.${c}.${m}`;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const same = (a,b) => a.length===b.length && a.every(x => b.includes(x));
const L = i => String.fromCharCode(65+i);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTime = s => { s=Math.max(0,Math.floor(s)); const m=Math.floor(s/60); return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };

let timerHandle = null;
const stopTimer = () => { if (timerHandle){ clearInterval(timerHandle); timerHandle=null; } };

/* ---------- state ---------- */
let route = {cert:null, mode:null};
let LRN = null;   // learn state of current cert
let EXM = null;   // exam state of current cert
let reviewFilter = null, reviewId = null, pendingScroll = null;
let REVEAL = false;  // chế độ hiện đáp án (ch? Học)
let peekId = null;   // câu đang bật EN+VI tạm thời (chỉ trong chế độ Học)
let LANG = LS.get('ccprac.v1.lang') || 'en';
const setLang = l => { LANG = l; LS.set('ccprac.v1.lang', l); };

function optionOrders(ids, cert){
  return Object.fromEntries(ids.map(id => [id, shuffle(BY_ID[cert][id].o.map((_, i) => i))]));
}
function displayedQuestion(q, state){
  const order = state.optionOrders?.[q.id];
  if (!order) return q;
  return {...q, o:order.map(i => q.o[i]), v:q.v && {...q.v, o:order.map(i => q.v.o[i])}};
}
function loadLearn(c){
  const s = LS.get(KEY(c,'learn'));
  const previousTopic = s?.topic;
  if(s) s.topic=validTopic(c,s.topic);
  const ids = topicIds(c,s?.topic);
  // Upgrade old topic filters without discarding previously selected answers/progress.
  // Old categories (agent/prompt/etc.) no longer exist in the official domain taxonomy.
  if(s && previousTopic && !s.topic && Array.isArray(s.order) && s.order.every(id=>BY_ID[c][id])){
    const order = s.shuffle ? shuffle(ids) : ids;
    const migrated = {...s, topic:'', retry:false, fullOrder:null,
      order:order.slice(0,countFor(s.size,ids.length)), idx:0,
      optionOrders:s.shuffle ? optionOrders(ids,c) : null};
    LS.set(KEY(c,'learn'),migrated);
    return migrated;
  }
  if (s && Array.isArray(s.order) && (s.retry ? (s.fullOrder && s.fullOrder.length===countFor(s.size, ids.length)) : s.order.length===countFor(s.size, ids.length)) && s.order.every(i => BY_ID[c][i])) {
    if (s.shuffle && !s.optionOrders) {
      s.optionOrders = optionOrders(ids, c);
      LS.set(KEY(c,'learn'), s);
    }
    return s;
  }
  return {shuffle:false, order:ids, idx:0, ans:{}, checked:{}};
}
const saveLearn = () => LS.set(KEY(route.cert,'learn'), LRN);
function loadExam(c){
  const s = LS.get(KEY(c,'exam'));
  if(s) s.topic=validTopic(c,s.topic);
  if (s && s.phase && (s.phase==='intro' || (Array.isArray(s.ids) && s.ids.every(i => BY_ID[c][i])))) return s;
  return {phase:'intro'};
}
const saveExam = () => LS.set(KEY(route.cert,'exam'), EXM);

/* ---------- routing ---------- */
function parseHash(){
  const m = location.hash.match(/^#\/(\w+)(?:\/(learn|exam))?/);
  if (m && certById(m[1])) return {cert:m[1], mode:m[2]||'learn'};
  return {cert:null, mode:null};
}
function go(h){ if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', render);

/* ---------- modal ---------- */
function confirmBox({title, text, ok='Đồng ý', cancel='Hủy', danger=false}){
  return new Promise(res => {
    const root = $('#modal-root');
    root.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true">
      <h3>${esc(title)}</h3><p>${text}</p>
      <div class="row"><button class="btn" data-x="0">${esc(cancel)}</button><button class="btn ${danger?'danger':'primary'}" data-x="1">${esc(ok)}</button></div></div></div>`;
    const done = v => { root.innerHTML=''; document.removeEventListener('keydown', onKey, true); res(v); };
    const onKey = e => { if (e.key==='Escape'){ e.stopPropagation(); done(false); } else if (e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); } };
    document.addEventListener('keydown', onKey, true);
    root.querySelector('.overlay').addEventListener('click', e => {
      if (e.target.classList.contains('overlay')) done(false);
      const b = e.target.closest('[data-x]'); if (b) done(b.dataset.x==='1');
    });
    root.querySelector('[data-x="1"]').focus();
  });
}

/* ---------- Home ---------- */
async function startCourse(cert){
  const startingHash = location.hash;
  showBankLoading();
  try {
    await loadQuestionBank(cert);
  } catch (error) {
    if (location.hash === startingHash)
      showBankError(cert, error, () => startCourse(cert));
    return;
  }
  // Ignore an outdated click if the user navigated away during loading.
  if (location.hash !== startingHash) return;
  const previous = loadLearn(cert);
  const {topic, size, shuffle:random} = previous;
  const pool = topicIds(cert, topic);
  const order = (random ? shuffle(pool) : pool).slice(0, countFor(size, pool.length));
  LS.set(KEY(cert,'learn'), {
    topic, size, shuffle:random, order, idx:0, ans:{}, checked:{},
    optionOrders:random ? optionOrders(order,cert) : null
  });
  go(`#/${cert}/learn`);
}
function renderHome(){
  stopTimer();
  document.title = 'Claude Cert Practice';
  $('#app').innerHTML = `<div class="home">
    <span class="eyebrow">Practice • Offline</span>
    <h1>Luyện thi <span>Claude Certification</span></h1>
    <p class="lead">Chọn một chứng chỉ để bắt đầu. Học từng câu với giải thích chi tiết, hoặc chọn số câu để thi thử.</p>
    <div class="cards">${CERTS.map(c => {
      const n = QUESTION_COUNTS[c.id], ls = LS.get(KEY(c.id,'learn'));
      const done = ls && ls.checked ? Object.keys(ls.checked).length : 0;
      const pct = Math.round(done/n*100);
      return `<button class="cert-card" style="--accent:${c.accent}" data-cert="${c.id}">
        <div class="badge">${c.code}</div>
        <div><h2>${c.name}</h2></div><div class="sub">${c.sub}</div>
        <div class="desc">${c.desc}</div>
        <div><div class="bar"><i style="width:${pct}%"></i></div></div>
        <div class="meta"><span><b>${n}</b> câu hỏi${done?` • Đã học <b>${done}</b>`:''}</span><span class="go">Bắt đầu ${ic('arrowR')}</span></div>
      </button>`;}).join('')}</div></div>`;
  $('#app').querySelectorAll('[data-cert]').forEach(b => b.onclick = () => startCourse(b.dataset.cert));
}

/* ---------- Shared pieces ---------- */
function topbar(c, actionsHtml){
  return `<header class="topbar"><div class="topbar-in">
    <button class="back" id="btn-home" title="Chọn chứng chỉ" aria-label="Về trang chọn chứng chỉ">${ic('back')}</button>
    <div class="brand" style="--accent:${c.accent}"><div class="badge" style="background:${c.accent}">${c.code}</div>
      <div><b>${c.name}</b><small>${c.sub} • ${DATA[c.id].qs.length} câu</small></div></div>

let settingsOpen = false;

function bindTop(){

function questionHTML(q, num, o){
  // o: {selected[], checked, mode:'learn'|'exam'|'review', showResult}
  const multi = q.m > 1, sel = o.selected || [];
  const lock = o.checked || o.mode==='review';
  const lang = (o.mode==='learn' && q.v) ? (peekId===q.id ? 'both' : LANG) : 'en';
  const peekBtn = (o.mode==='learn' && q.v && LANG!=='both') ? `<button class="peek ${peekId===q.id?'on':''}" id="btn-peek" type="button">${peekId===q.id?'Ẩn bản dịch':'EN+VI'}</button>` : '';
  const txt = (en, vi) => lang==='vi' ? vi : lang==='both' ? `${vi}<div class="en">${en}</div>` : en;
  const opts = q.o.map((op,i) => {
    let cls = 'opt';
    const isC = q.a.includes(op.k), isS = sel.includes(op.k);
    if (o.showResult){
      if (isC) cls += ' right'; else if (isS) cls += ' wrong';
    } else if (isS) cls += ' sel';
    const mark = o.showResult ? (isC ? ic('check') : (isS ? '✗' : L(i))) : L(i);
    // Correct options must still show whether the student actually selected them.
    const flags = o.mode==='review' && o.showResult && (isS || isC)
      ? `<span class="choice-flags">${isS?'<span class="choice-flag chosen">Bạn đã chọn</span>':''}${isC?'<span class="choice-flag correct">Đáp án đúng</span>':''}</span>`
      : '';
    return `<button class="${cls}" data-opt="${esc(op.k)}" ${lock?'disabled':''} aria-pressed="${isS}">
      <span class="mark">${mark}</span><span class="t rich">${txt(op.h, q.v ? q.v.o[i] : op.h)}${flags}</span></button>`;
  }).join('');
  const resultTag = o.mode==='review' && o.status
    ? `<span class="tag review-result ${o.status}">${{correct:'✓ Chính xác',incorrect:'✗ Chưa đúng',unanswered:'Chưa trả lời'}[o.status]}</span>`
    : '';
  return `<div class="qhead"><span class="qnum">Câu ${num}</span>${resultTag}${multi?`<span class="tag">Chọn ${q.m} đáp án</span>`:'<span>Chọn 1 đáp án</span>'}${peekBtn}</div>
    <div class="qtext rich">${txt(q.q, q.v ? q.v.q : q.q)}</div>
    <div class="opts ${multi?'multi':''}">${opts}</div>`;
}
function answerTipHTML(q){
  const tip = q.tip;
  if (!tip || typeof tip.text !== 'string') return '';
  const caution = tip.kind === 'caution';
  const phrases = !caution && Array.isArray(tip.cues) ? tip.cues.map(c => `<code>${esc(c.label || c.phrase)}</code>`).join(' · ') : '';
  return `<aside class="answer-tip${caution?' caution':''}">
    <h5>${caution?'Lưu ý khi làm câu này':'Mẹo nhận diện đáp án'}</h5>
    <p>${esc(tip.text)}</p>
    ${!caution && tip.contrast?`<p class="tip-contrast"><b>Phân biệt với câu dễ nhầm:</b> ${esc(tip.contrast)}</p>`:''}
    ${phrases?`<div class="tip-keywords"><b>Cụm từ cần nhận diện (chỉ trong ngữ cảnh câu này):</b> ${phrases}</div>`:''}
  </aside>`;
}
function feedbackHTML(q, sel){
  const ok = same(sel, q.a);
  const letters = q.a.map(k => L(q.o.findIndex(o => o.k===k))).sort().join(', ');
  const none = !sel.length && REVEAL;
  return `<div class="feedback ${none?'info':ok?'ok':'ko'}"><h4>${none?'? đáp án':ok?'✓ Chính xác!':'✗ Chưa đúng'}</h4>
    <div class="ans">Đáp án đúng: <b>${letters}</b></div>
    ${q.e?`<div class="why rich"><b>Giải thích:</b> ${q.e}</div>`:''}${answerTipHTML(q)}</div>`;
}
function mapHTML(items, cur){
  return `<div class="map">${items.map((it,i)=>`<button class="node ${it.cls||''} ${i===cur?'cur':''}" data-go="${i}" title="Câu ${i+1}${it.m>1?` • chọn ${it.m} đáp án`:''}">${i+1}${it.m>1?`<b class="mb">${it.m}</b>`:''}</button>`).join('')}</div>`;
}
function toggleSel(q, sel, k){
  if (q.m === 1) return [k];
  if (sel.includes(k)) return sel.filter(x => x!==k);
  if (sel.length >= q.m) return sel;
  return sel.concat(k);
}

/* ---------- LEARN ---------- */
function learnStats(){
  let ok=0, ko=0;
  for (const id of LRN.order){ if (LRN.checked[id]){ same(LRN.ans[id]||[], BY_ID[route.cert][id].a) ? ok++ : ko++; } }
  return {ok, ko, left: LRN.order.length-ok-ko};
}
function renderLearn(){
  peekId = null;
  const c = certById(route.cert), n = LRN.order.length;
  const st = learnStats();
  const actions = `
    ${selectTopic(c.id,LRN.topic)}
    ${selectSize(LRN.size || 'ALL')}
    <div class="seg" style="--accent:${c.accent}" title="Ngôn ngữ câu hỏi">

      <button data-lang="both" class="${LANG==='both'?'on':''}">EN+VI</button></div>
    <div class="seg" style="--accent:${c.accent}" title="Thứ tự câu hỏi">
      <button data-order="seq" class="${LRN.shuffle?'':'on'}">Thứ tự gốc</button>
      <button data-order="rnd" class="${LRN.shuffle?'on':''}">Xáo trộn</button></div>
    <button class="btn ${REVEAL?'primary':''}" id="btn-reveal" title="Hiện đáp án và giải thích cho toàn bộ câu hỏi">${ic('check')}<span>${REVEAL?'Ẩn đáp án':'Hiện đáp án'}</span></button>
    <button class="btn" id="btn-reshuffle" title="Xáo trộn lại câu hỏi và các lựa chọn (giữ tiến độ)">${ic('shuffle')}<span>Trộn lại</span></button>
    <button class="btn" id="btn-reset">${ic('reset')}<span>Làm lại</span></button>`;
  $('#app').innerHTML = topbar(c, actions) + `<div class="layout" style="--accent:${c.accent}">
    <aside class="panel side">
      <h3>Danh sách câu hỏi <span id="side-count"></span></h3>
      <div id="map-slot"></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>Đúng</span><span><i style="background:var(--bad)"></i>Sai</span><span><i style="background:var(--gray)"></i>Chưa làm</span><span><i style="background:var(--warn);width:12px;height:12px;border-radius:99px"></i>Nhiều đáp án</span></div>
    </aside>
    <main class="main" id="main-slot"></main></div>`;
  bindTop();
  $('#topic-filter').onchange = e => {
    LRN.topic = e.target.value;
    setOrder(LRN.shuffle,true);
  };
  $('#question-count').onchange = e => {
    LRN.size = e.target.value;
    setOrder(LRN.shuffle, true);
  };
  document.querySelectorAll('[data-order]').forEach(b => b.onclick = () => setOrder(b.dataset.order==='rnd'));
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { setLang(b.dataset.lang); renderLearn(); });
  $('#btn-reveal').onclick = () => { REVEAL = !REVEAL; renderLearn(); };
  $('#btn-reshuffle').onclick = reshuffleLearn;
  $('#btn-reset').onclick = resetLearn;
  paintLearn();
}
function paintLearn(){
  const c = certById(route.cert), id = LRN.order[LRN.idx], q = displayedQuestion(BY_ID[route.cert][id], LRN);
  const sel = LRN.ans[id] || [], checked = !!LRN.checked[id] || REVEAL;
  const st = learnStats(), n = LRN.order.length;
  const items = LRN.order.map(i => ({m: BY_ID[route.cert][i].m, cls: LRN.checked[i] ? (same(LRN.ans[i]||[], BY_ID[route.cert][i].a)?'done':'bad') : ''}));
  $('#map-slot').innerHTML = mapHTML(items, LRN.idx);
  $('#side-count').textContent = `${st.ok+st.ko}/${n}`;
  const needOk = sel.length === q.m;
  $('#main-slot').innerHTML = `
    <div class="stats">
      <span class="chip"><i style="background:var(--ok)"></i>Đúng ${st.ok}</span>
      <span class="chip"><i style="background:var(--bad)"></i>Sai ${st.ko}</span>
      <span class="chip"><i style="background:var(--gray-ink)"></i>Còn lại ${st.left}</span>
      <span class="chip">${LRN.retry?'Đang làm lại câu sai':LRN.shuffle?'Thứ tự ngẫu nhiên':'Thứ tự gốc'}</span>
      <span class="spacer"></span>
      ${LRN.retry?`<button class="btn" id="btn-retry-exit">Quay lại toàn bộ câu hỏi</button>`:''}
      <button class="btn ${LRN.retry?'':'primary'}" id="btn-retry" ${st.ko?'':'disabled'} title="Chỉ làm lại những câu bạn đã trả lời sai">${ic('reset')}Làm lại câu sai (${st.ko})</button></div>
    <div class="progress"><i style="width:${(st.ok+st.ko)/n*100}%"></i></div>
    <section class="panel qcard">
      ${questionHTML(q, LRN.idx+1, {selected:sel, checked, mode:'learn', showResult:checked})}
      ${checked ? feedbackHTML(q, sel) : (q.m>1?`<div class="hint">Đã chọn ${sel.length}/${q.m}</div>`:'')}
      <div class="qfoot">
        <button class="btn" id="btn-prev" ${LRN.idx===0?'disabled':''}>${ic('arrowL')}Câu trước</button>
        ${checked
          ? `<button class="btn primary" id="btn-next" ${LRN.idx===n-1?'disabled':''}>Câu tiếp ${ic('arrowR')}</button>`
          : `<button class="btn primary" id="btn-check" ${needOk?'':'disabled'}>${ic('check')}Kiểm tra đáp án <span class="kbd">Enter</span></button>`}
      </div>
    </section>`;
  bindLearnMain(q);
}
function bindLearnMain(q){
  const id = q.id;
  document.querySelectorAll('#main-slot [data-opt]').forEach(b => b.onclick = () => {
    if (LRN.checked[id] || REVEAL) return;
    LRN.ans[id] = toggleSel(q, LRN.ans[id]||[], b.dataset.opt); saveLearn(); paintLearn();
  });
  const set = (sel, fn) => { const e = $(sel); if (e) e.onclick = fn; };
  set('#btn-prev', () => learnGo(LRN.idx-1));
  set('#btn-next', () => learnGo(LRN.idx+1));
  set('#btn-check', learnCheck);
  set('#btn-retry', retryWrong); set('#btn-retry-exit', exitRetry);
  set('#btn-peek', () => { peekId = peekId===id ? null : id; paintLearn(); });
  document.querySelectorAll('#map-slot [data-go]').forEach(b => b.onclick = () => learnGo(+b.dataset.go));
}
function scrollToQuestion(){
  if (window.matchMedia('(max-width:760px)').matches){
    $('.map-open .map-toggle')?.click();
    $('.qcard')?.scrollIntoView({block:'start'});
  } else window.scrollTo({top:0,behavior:'smooth'});
}
function learnGo(i){ if (i<0 || i>=LRN.order.length) return; peekId = null; LRN.idx=i; saveLearn(); paintLearn(); scrollToQuestion(); }
function learnCheck(){
  const id = LRN.order[LRN.idx], q = displayedQuestion(BY_ID[route.cert][id], LRN);
  if ((LRN.ans[id]||[]).length !== q.m) return;
  LRN.checked[id] = true; saveLearn(); paintLearn();
}
function setOrder(rnd, force=false){
  if (!force && rnd === LRN.shuffle && !LRN.retry) return;
  LRN.retry = false; delete LRN.fullOrder;
  LRN.shuffle = rnd;
  LRN.optionOrders = rnd ? optionOrders(ALL_IDS(route.cert), route.cert) : null;
  LRN.order = learnOrder(rnd);
  LRN.idx = 0; saveLearn(); renderLearn();
}
function reshuffleLearn(){
  LRN.retry = false; delete LRN.fullOrder;
  LRN.optionOrders = optionOrders(ALL_IDS(route.cert), route.cert);
  LRN.shuffle = true; LRN.order = learnOrder(true); LRN.idx = 0; saveLearn(); renderLearn();
}
function retryWrong(){
  const wrong = LRN.order.filter(id => LRN.checked[id] && !same(LRN.ans[id]||[], BY_ID[route.cert][id].a));
  if (!wrong.length) return;
  if (!LRN.retry) LRN.fullOrder = LRN.order.slice();
  for (const id of wrong){ delete LRN.ans[id]; delete LRN.checked[id]; }
  LRN.retry = true; LRN.order = wrong; LRN.idx = 0; saveLearn(); renderLearn(); window.scrollTo(0,0);
}
function exitRetry(){
  if (!LRN.retry) return;
  LRN.order = LRN.fullOrder; LRN.retry = false; delete LRN.fullOrder; LRN.idx = 0; saveLearn(); renderLearn();
}
async function resetLearn(){
  const has = Object.keys(LRN.checked).length || Object.keys(LRN.ans).length;
  if (has && !await confirmBox({title:'Làm lại từ đầu?', text:'Toàn bộ tiến độ học của bộ câu hỏi này sẽ bị xóa. '+(LRN.shuffle?'Thứ tự câu hỏi sẽ được xáo trộn lại.':'Thứ tự câu hỏi quay về mặc định.'), ok:'Làm lại', danger:true})) return;
  LRN = {topic:LRN.topic, size:LRN.size, shuffle:LRN.shuffle, optionOrders:LRN.shuffle ? optionOrders(ALL_IDS(route.cert), route.cert) : null, order: learnOrder(LRN.shuffle), idx:0, ans:{}, checked:{}};
  saveLearn(); renderLearn();
}

/* BEGIN EXAM REVIEW */
function examReviewStatus(q, selected){
  return !selected.length ? 'unanswered' : same(selected, q.a) ? 'correct' : 'incorrect';
}
function examReviewIds(cert, ids, answers, filter){
  return ids.filter(id => {
    const selected = Array.isArray(answers?.[id]) ? answers[id] : [];
    const status = examReviewStatus(BY_ID[cert][id], selected);
    return filter==='all' || (filter==='missed' ? status!=='correct' : status===filter);
  });
}
function answerLetters(q, selected){
  return q.o.map((option,i) => selected.includes(option.k) ? L(i) : null).filter(Boolean).join(', ') || 'Không chọn';
}
function examReviewHTML(c, n, correct, un, reviewedIds, activeReviewId){
  if (!reviewFilter) return '';
  const reviewPosition = reviewedIds.indexOf(activeReviewId);
  let reviewCard = '';
  if (activeReviewId) {
    const question = displayedQuestion(BY_ID[c.id][activeReviewId], EXM);
    const selected = exSel(activeReviewId);
    const status = examReviewStatus(question, selected);
    const questionNumber = EXM.ids.indexOf(activeReviewId) + 1;
    reviewCard = `
      <div class="rv" data-status="${status}">
        <section class="panel qcard">
          ${questionHTML(question, questionNumber, {selected, mode:'review', showResult:true, status})}
          <div class="hint review-answer"><b>Bạn chọn:</b> ${answerLetters(question, selected)}
            · <b class="answer-right">Đáp án đúng:</b> ${answerLetters(question, question.a)}</div>
          ${question.e||question.tip?`<div class="feedback review-explain">${question.e?`<div class="why rich"><b>Giải thích:</b> ${question.e}</div>`:''}${answerTipHTML(question)}</div>`:''}
        </section>
        <div class="review-pager">
          <button class="btn" id="btn-review-prev" ${reviewPosition===0?'disabled':''}>${ic('arrowL')}Câu trước</button>
          <span>${reviewPosition+1}/${reviewedIds.length} trong bộ lọc</span>
          <button class="btn" id="btn-review-next" ${reviewPosition===reviewedIds.length-1?'disabled':''}>Câu tiếp ${ic('arrowR')}</button>
        </div>
      </div>`;
  }
  const filters = [
    ['all', `Tất cả (${n})`],
    ['correct', `Đúng (${correct})`],
    ['incorrect', `Sai (${n-correct-un})`],
    ['unanswered', `Bỏ trống (${un})`],
    ['missed', `Chưa đúng (${n-correct})`]
  ];
  return `
    <section class="review" id="exam-review" aria-labelledby="review-heading">
      <h3 id="review-heading">Xem lại câu trả lời</h3>
      <div class="review-filters" role="group" aria-label="Lọc câu hỏi theo kết quả">
        ${filters.map(([filter,label]) => `<button type="button" class="review-filter" data-review-filter="${filter}"
          aria-pressed="${reviewFilter===filter}">${label}</button>`).join('')}
      </div>
      ${reviewCard || '<p class="panel review-empty">Không có câu hỏi trong bộ lọc này.</p>'}
    </section>`;
}
/* END EXAM REVIEW */

/* ---------- EXAM ---------- */
const exSel = id => (EXM.ans[id] || []);
const exAnswered = () => EXM.ids.filter(id => exSel(id).length > 0).length;
function renderExam(){
  stopTimer();

    <aside class="panel side">
      <h3>Danh sách câu hỏi <span id="side-count"></span></h3>
      <div id="map-slot"></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>Đã chọn</span><span><i style="background:var(--gray)"></i>Chưa làm</span><span><i style="background:var(--warn);width:12px;height:12px;border-radius:99px"></i>Nhiều đáp án</span></div>
    </aside>
    <main class="main" id="main-slot"></main></div>`;

  tick(); timerHandle = setInterval(tick, 1000);
  paintExam();
}
function paintExam(){
  const id = EXM.ids[EXM.idx], q = displayedQuestion(BY_ID[route.cert][id], EXM), n = EXM.ids.length, sel = exSel(id);
  const items = EXM.ids.map(i => ({m: BY_ID[route.cert][i].m, cls: exSel(i).length ? 'done' : ''}));

  $('#main-slot').innerHTML = `
    <div class="stats"><span class="chip"><i style="background:var(--ok)"></i>Đã làm ${ans}</span>
      <span class="chip"><i style="background:var(--gray-ink)"></i>Chưa làm ${n-ans}</span></div>
    <div class="progress"><i style="width:${ans/n*100}%"></i></div>
    <section class="panel qcard">
      ${questionHTML(q, EXM.idx+1, {selected:sel, mode:'exam'})}

      <div class="qfoot">
        <button class="btn" id="btn-prev" ${EXM.idx===0?'disabled':''}>${ic('arrowL')}Câu trước</button>
        <button class="btn primary" id="btn-next" ${EXM.idx===n-1?'disabled':''}>Câu tiếp ${ic('arrowR')}</button>
      </div>
    </section>`;
  document.querySelectorAll('#main-slot [data-opt]').forEach(b => b.onclick = () => {
    EXM.ans[id] = toggleSel(q, exSel(id), b.dataset.opt); saveExam(); paintExam();
  });
  const set = (s, f) => { const e=$(s); if (e) e.onclick=f; };
  set('#btn-prev', () => examGo(EXM.idx-1)); set('#btn-next', () => examGo(EXM.idx+1));
  document.querySelectorAll('#map-slot [data-go]').forEach(b => b.onclick = () => examGo(+b.dataset.go));
}
function examGo(i){ if (i<0||i>=EXM.ids.length) return; EXM.idx=i; saveExam(); paintExam(); scrollToQuestion(); }
function startRetryExam(){
  if (!EXM.wrong || !EXM.wrong.length) return;
  EXM = {topic:EXM.topic, size:EXM.size || '10', phase:'run', ids: shuffle(EXM.wrong), ans:{}, idx:0, start:Date.now(), practice:true};
  EXM.optionOrders = optionOrders(EXM.ids, route.cert);
  reviewFilter = reviewId = null; saveExam(); renderExam(); window.scrollTo(0,0);
}
function startExam(){
  const ids = examTopicIds(route.cert,EXM.topic);
  const size = EXM.size || 'OFFICIAL';
  const count = examCount(size,ids.length,route.cert);
  // Domain-specific practice is intentionally not blueprint-weighted.
  // ALL includes every in-scope question, so its distribution follows the bank.
  const picked = EXM.topic || count===ids.length
    ? shuffle(ids).slice(0,count)
    : weightedExamIds(route.cert,count);
  EXM = {topic:EXM.topic, size, phase:'run', ids:picked, ans:{}, idx:0, start:Date.now()};
  EXM.optionOrders = optionOrders(EXM.ids, route.cert);
  reviewFilter = reviewId = null; saveExam(); renderExam(); window.scrollTo(0,0);
}
async function submitExam(){
  const n = EXM.ids.length, ans = exAnswered(), left = n-ans;
  const ok = await confirmBox({title:'Nộp bài thi?',
    text: left ? `Bạn còn <b>${left}</b> câu chưa làm (Đã làm ${ans}/${n}). Các câu chưa làm sẽ bị tính là sai.<br>Bạn có chắc chắn muốn nộp bài?` : `Bạn đã trả lời đủ ${n}/${n} câu.<br>Bạn có chắc chắn muốn nộp bài?`,
    ok:'Nộp bài', cancel:'Làm tiếp'});
  if (!ok) return;
  const wrong = EXM.ids.filter(id => !same(exSel(id), BY_ID[route.cert][id].a));
  EXM.phase = 'result'; EXM.end = Date.now(); EXM.correct = n - wrong.length; EXM.wrong = wrong;
  reviewFilter = reviewId = null; saveExam(); renderExam(); window.scrollTo(0,0);
}
function renderExamIntro(c){
  const choice = EXM.size || 'OFFICIAL';
  const total = examTopicIds(c.id,EXM.topic).length;
  const n = examCount(choice,total,c.id);
  const weighted = !EXM.topic && n<total;
  const pools = Object.fromEntries(BLUEPRINTS[c.id].domains.map(d=>[d.id,DATA[c.id].qs.filter(q=>q.topic===d.id)]));
  const quota = weighted ? weightedExamQuotas(c.id,n,pools) : null;
  const distribution = weighted ? `<details class="blueprint-distribution"><summary>Xem phân bổ theo blueprint trước 07/12/2026</summary>
    <ul>${BLUEPRINTS[c.id].domains.map(d=>`<li>D${d.id.slice(1)} · ${d.vi}: ${quota[d.id]} câu (${d.weight}%)</li>`).join('')}</ul></details>` : '';
  $('#app').innerHTML = topbar(c, '') + `<div class="layout single" style="--accent:${c.accent}"><main class="main">
    <section class="panel hero">
      <div class="badge" style="background:${c.accent}">${c.code}</div>
      <h2>Thi thử ${c.name}</h2>
      ${selectTopic(c.id,EXM.topic,true)}
      ${selectExamSize(choice,c.id)}
      <p>${weighted
        ? `Chọn ngẫu nhiên ${n} câu theo trọng số từng domain của Anthropic (blueprint trước 07/12/2026).`
        : EXM.topic
          ? `Luyện riêng domain đã chọn: ${n}/${total} câu ngẫu nhiên (không áp dụng trọng số toàn đề).`
          : `Dùng toàn bộ ${total} câu trong phạm vi đề; tỷ lệ thực tế của ngân hàng có thể khác blueprint.`}
        Bạn có thể chuyển đến bất kỳ câu nào và nộp bài khi sẵn sàng.</p>
      ${distribution}
      <p class="sub">Mục tiêu 80% chỉ dùng để tự đánh giá khi luyện tập. Anthropic chấm theo scaled score và không công bố công thức quy đổi từ tỷ lệ đúng.</p>
      <p class="sub"><a href="${BLUEPRINTS[c.id].source}" target="_blank" rel="noopener noreferrer">Exam Guide chính thức (November 2026)</a></p>
      <div class="rules">
        <div class="rule" style="--accent:${c.accent}"><b>${n}</b><span>câu hỏi ngẫu nhiên</span></div>
        <div class="rule" style="--accent:${c.accent}"><b>≥ ${passMark(n)}</b><span>câu đúng theo mục tiêu luyện tập</span></div>
        <div class="rule" style="--accent:${c.accent}"><b>80%</b><span>Mục tiêu luyện tập (không phải điểm chuẩn Anthropic)</span></div>
      </div>
      <button class="btn primary lg" id="btn-start" style="background:${c.accent};border-color:${c.accent}">${ic('play')}Bắt đầu thi</button>
    </section></main></div>`;
  $('#topic-filter').onchange = e => {
    EXM.topic = e.target.value;
    saveExam(); renderExamIntro(c);
  };
  $('#question-count').onchange = e => {
    EXM.size = e.target.value;
    saveExam(); renderExamIntro(c);
  };
  bindTop(); $('#btn-start').onclick = startExam;
}
function renderExamResult(c){
  // Compute the report from the submitted answer set, including legacy saved exams.
  const report = scoreExam(c.id, EXM.ids, EXM.ans);
  const n = report.total, correct = report.correct, practice = !!EXM.practice;
  const passed = practice ? correct === n : report.targetReached;
  const wrongIds = EXM.ids.filter(id => !same(exSel(id), BY_ID[c.id][id].a));
  const un = report.unanswered;
  const reviewedIds = reviewFilter ? examReviewIds(c.id, EXM.ids, EXM.ans, reviewFilter) : [];
  const activeReviewId = reviewedIds.includes(reviewId) ? reviewId : reviewedIds[0];
  const reviewHTML = examReviewHTML(c, n, correct, un, reviewedIds, activeReviewId);
  const pct = report.accuracy / 100, R = 76, C = 2*Math.PI*R;
  const items = EXM.ids.map(id => {
    const status = examReviewStatus(BY_ID[c.id][id], exSel(id));
    return {m: BY_ID[c.id][id].m, cls: status==='unanswered' ? '' : status==='correct' ? 'done' : 'bad'};
  });
  const col = passed ? 'var(--ok)' : 'var(--bad)';
  const weak = weakestDomains(report);
  const domainCards = report.domains.filter(d => d.total > 0).map(d => `
    <div class="domain-score">
      <div class="domain-heading"><b>D${d.id.slice(1)} · ${d.vi}</b>
        <span class="domain-count">${d.correct}/${d.total} · ${displayScorePercent(d.accuracy)}%</span></div>
      <div class="domain-track" role="progressbar" aria-label="D${d.id.slice(1)}: ${d.vi}"
        aria-valuenow="${Math.round(d.accuracy)}" aria-valuemin="0" aria-valuemax="100">
        <div class="domain-fill" style="width:${d.accuracy}%"></div></div>
      <small>Trọng số blueprint: ${d.weight}% · Sai hoặc bỏ trống: ${d.incorrect}
        ${d.unanswered ? `(bỏ trống ${d.unanswered})` : ''}</small>
    </div>`).join('');
  const weakSection = weak.length
    ? `<ol>${weak.map(d => `<li><b>D${d.id.slice(1)} · ${d.vi}</b>:
      ${d.correct}/${d.total} câu đúng (${displayScorePercent(d.accuracy)}%)</li>`).join('')}</ol>`
    : '<p>Không có domain nào dưới mục tiêu luyện tập 80% trong các câu đã làm.</p>';
  const domainBreakdown = `
    <section class="panel domain-scoreboard" aria-labelledby="domain-score-heading">
      <div><h3 id="domain-score-heading">Kết quả theo từng domain</h3>
        <p class="sub">Thống kê theo các câu thực tế trong lượt thi này, không phải scaled score của Anthropic.
        Domain không có câu hỏi sẽ không được đánh giá.</p></div>
      <div class="domain-scores">${domainCards}</div>
      ${report.unclassified ? `<p class="sub">${report.unclassified} câu từ lượt thi đã lưu
        chưa được ánh xạ vào domain chính thức.</p>` : ''}
      <div class="domain-priorities"><h3>Ưu tiên ôn thêm</h3>
        ${weakSection}
        <p class="sub">Các domain được sắp xếp theo tỷ lệ đúng thấp nhất;
        kết quả ít câu chỉ mang tính tham khảo. Hãy luyện thêm trước khi đánh giá tiến bộ.</p></div>
    </section>`;
  $('#app').innerHTML = topbar(c, '') + `<div class="layout" style="--accent:${c.accent}">
    <aside class="panel side"><h3>Kết quả từng câu <span>${correct}/${n}</span></h3>
      <div id="map-slot">${mapHTML(items, -1)}</div>
      <div class="legend"><span><i style="background:var(--ok)"></i>Đúng</span><span><i style="background:var(--bad)"></i>Sai</span><span><i style="background:var(--gray)"></i>Bỏ trống</span><span><i style="background:var(--warn);width:12px;height:12px;border-radius:99px"></i>Nhiều đáp án</span></div></aside>
    <main class="main">
      <section class="panel result">
        <div class="ring"><svg width="176" height="176" viewBox="0 0 176 176">
          <circle cx="88" cy="88" r="${R}" fill="none" stroke="var(--gray)" stroke-width="14"/>
          <circle cx="88" cy="88" r="${R}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>
          <div class="c"><b>${correct}/${n}</b><span>${displayScorePercent(report.accuracy)}% đúng</span></div></div>
        <div>
          <div class="verdict ${passed?'pass':'fail'}">${practice
            ? (passed ? 'Đã làm đúng tất cả' : 'Tiếp tục ôn tập')
            : (passed ? 'Đạt mục tiêu luyện tập' : 'Chưa đạt mục tiêu luyện tập')}</div>
          <p class="sub">${practice
            ? `Lượt ôn lại câu sai: ${correct}/${n} câu đúng, không dùng để kết luận đạt hay trượt.`
            : passed
              ? `Bạn đạt mục tiêu của ứng dụng: ${correct}/${n} câu đúng (tối thiểu ${passMark(n)}/${n}).`
              : `Bạn đúng ${correct}/${n} câu, còn thiếu ${passMark(n)-correct} câu để đạt mục tiêu luyện tập ${passMark(n)}/${n}.`}</p>
          <p class="score-note"><b>Lưu ý:</b> Ngưỡng 80% là mục tiêu luyện tập riêng của ứng dụng,
            không phải chuẩn đạt kỳ thi Claude. Anthropic sử dụng điểm quy đổi (scaled score)
            và ngưỡng 720; không có công thức quy đổi từ % câu đúng sang điểm chính thức được công bố.
            Câu nhiều đáp án phải chọn đúng toàn bộ mới được tính đúng trong ứng dụng.</p>
          <div class="kpis"><div class="kpi"><b style="color:var(--ok)">${correct}</b><span>Câu Đúng</span></div>
            <div class="kpi"><b style="color:var(--bad)">${n-correct}</b><span>Câu sai${un?` (${un} bỏ trống)`:''}</span></div>
            <div class="kpi"><b>${fmtTime((EXM.end-EXM.start)/1000)}</b><span>Thời gian</span></div></div>
          <div class="actions">
            <button class="btn" id="btn-review-all">${ic('list')}<span>${reviewFilter?'Ẩn xem lại':`Xem lại bài thi (${n})`}</span></button>
            <button class="btn" id="btn-wrong" ${wrongIds.length?'':'disabled'}>${ic('list')}<span>Xem câu chưa đúng (${wrongIds.length})</span></button>
            <button class="btn" id="btn-retrywrong" ${wrongIds.length?'':'disabled'}>${ic('reset')}<span>Làm lại câu sai</span></button>
            <button class="btn primary" id="btn-retake" style="background:${c.accent};border-color:${c.accent}">${ic('reset')}Thi lại</button></div>
        </div>
      </section>
      ${domainBreakdown}
      ${reviewHTML}
    </main></div>`;
  bindTop();
  const openReview = (filter, id) => {
    reviewFilter = filter;
    const ids = examReviewIds(c.id, EXM.ids, EXM.ans, filter);
    reviewId = id && ids.includes(id) ? id : (ids[0] || null);
    renderExamResult(c);
    $('#exam-review')?.scrollIntoView({behavior:'smooth', block:'start'});
  };
  $('#btn-review-all').onclick = () => {
    if (reviewFilter) {
      reviewFilter = reviewId = null;
      renderExamResult(c);
    } else openReview('all');
  };
  $('#btn-wrong').onclick = () => openReview('missed');
  $('#btn-retake').onclick = () => {
    EXM = {phase:'intro', topic:EXM.topic, size:EXM.size || 'OFFICIAL'};
    reviewFilter = reviewId = null;
    saveExam(); renderExam();
  };
  $('#btn-retrywrong').onclick = startRetryExam;
  document.querySelectorAll('[data-review-filter]').forEach(button => {
    button.onclick = () => openReview(button.dataset.reviewFilter);
  });
  const changeReview = offset => {
    const next = reviewedIds[reviewedIds.indexOf(activeReviewId) + offset];
    if (next) openReview(reviewFilter, next);
  };
  if ($('#btn-review-prev')) $('#btn-review-prev').onclick = () => changeReview(-1);
  if ($('#btn-review-next')) $('#btn-review-next').onclick = () => changeReview(1);
  document.querySelectorAll('#map-slot [data-go]').forEach(button => {
    button.onclick = () => openReview('all', EXM.ids[Number(button.dataset.go)]);
  });
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (!route.cert || $('#modal-root').firstChild || e.ctrlKey || e.metaKey || e.altKey) return;
  if (route.mode==='learn' && LRN){
    const id = LRN.order[LRN.idx], q = displayedQuestion(BY_ID[route.cert][id], LRN), checked = LRN.checked[id] || REVEAL;
    if (e.key==='ArrowRight') learnGo(LRN.idx+1);
    else if (e.key==='ArrowLeft') learnGo(LRN.idx-1);
    else if (e.key==='Enter'){ e.preventDefault(); checked ? learnGo(LRN.idx+1) : learnCheck(); }
    else if (/^[1-9]$/.test(e.key) && !checked && q.o[+e.key-1]){ LRN.ans[id] = toggleSel(q, LRN.ans[id]||[], q.o[+e.key-1].k); saveLearn(); paintLearn(); }
  } else if (route.mode==='exam' && EXM && EXM.phase==='run'){
    const id = EXM.ids[EXM.idx], q = displayedQuestion(BY_ID[route.cert][id], EXM);
    if (e.key==='ArrowRight') examGo(EXM.idx+1);
    else if (e.key==='ArrowLeft') examGo(EXM.idx-1);
    else if (/^[1-9]$/.test(e.key) && q.o[+e.key-1]){ EXM.ans[id] = toggleSel(q, exSel(id), q.o[+e.key-1].k); saveExam(); paintExam(); }
  }
});

/* ---------- main render ---------- */
let renderGeneration = 0;
async function render(){
  const generation = ++renderGeneration;
  stopTimer(); REVEAL = false; settingsOpen = false;
  const r = parseHash(); route = r;
  if (!r.cert){ LRN = EXM = null; return renderHome(); }
  const c = certById(r.cert);
  document.title = `${c.code} • ${r.mode==='exam'?'Thi':'Học'} • Claude Cert Practice`;
  if (!DATA[r.cert]) {
    showBankLoading();
    try {
      await loadQuestionBank(r.cert);
    } catch (error) {
      if (generation === renderGeneration)
        showBankError(r.cert, error, render);
      return;
    }
  }
  // A newer hash route takes precedence over an older pending fetch.
  if (generation !== renderGeneration) return;
  if (r.mode === 'learn'){ LRN = loadLearn(r.cert); renderLearn(); }
  else { EXM = loadExam(r.cert); reviewFilter = reviewId = null; renderExam(); }
}
render();
</script>
